[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project]
name = "promethee"
version = "0.1.0"
description = "Persistent world and action runtime for an embodied AI companion."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
viewer = ["numpy==2.4.6", "viser @ git+https://github.com/nv-tlabs/kimodo-viser.git@7c82ad8f8640bad9dff8ded5c5eee908eeb08f11"]
agent = [
    "mcp==2.0.0",
    "PyYAML==6.0.3",
]
memory = ["PyYAML==6.0.3"]
voice = ["openai==2.24.0", "sounddevice==0.5.3"]
avatar = ["numpy==2.4.6"]

[project.scripts]
promethee = "promethee.cli:main"
promethee-view = "promethee.viewer:main"
promethee-mcp = "promethee.mcp_server:main"
promethee-avatar = "promethee.avatar_viewer:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
