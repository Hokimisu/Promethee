[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project]
name = "promethee"
version = "0.1.0"
description = "Persistent world and action runtime for an embodied AI companion."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
promethee = "promethee.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
